name: Integration Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Node.js integration tests ───────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Node.js ${{ matrix.node-version }} instellen
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Dependencies installeren
        run: npm ci

      - name: Integration tests draaien
        run: npm test
        env:
          # Tijdelijke data-map voor de SQLite-database tijdens tests
          DATA_DIR: /tmp/lastfm-test-ci
          # Dummy-waarden zodat de startup-validatie in server.js slaagt
          LASTFM_API_KEY: ci-test-key
          LASTFM_USER: ci-test-user

  # ── Python Core backend smoke tests ────────────────────────────────────────
  test-python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Python 3.11 instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: core/requirements.txt

      - name: Core dependencies installeren
        run: |
          pip install -r core/requirements.txt
          pip install pytest

      - name: Ruff linter installeren
        run: pip install ruff

      - name: Python Core linting (ruff)
        run: ruff check core/

      - name: Python Core smoke tests draaien
        run: python -m pytest core/tests/ -v
        env:
          DATA_DIR: /tmp/lastfm-core-ci
          LASTFM_API_KEY: ci-test-key
          LASTFM_USER: ci-test-user
          PLEX_URL: http://localhost:32400
          PLEX_TOKEN: ci-test-token
          SLSKD_URL: http://localhost:5030
          SLSKD_API_KEY: ci-test-key
          HIFI_INSTANCES: http://localhost:9000
          DOWNLOAD_SOURCES: tidarr,soulseek,hifi,orpheus
          ORPHEUS_URL: http://localhost:5000
